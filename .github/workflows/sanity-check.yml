name: Ne.app User Bld Sanity Build (Debian)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  BUILD_TYPE: SANITY

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Attempt NeBuild
      run: sudo curl https://github.com/ne-app-eu/bld/releases/download/v0.0.6-apple-m1/nebuild-debian -o sanity-test
